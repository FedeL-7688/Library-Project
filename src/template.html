<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H1>Bookshelf</H1>
    <section id="bookshelf">

        

    </section>
    <button id="openDiag">New Book</button>
    <dialog id="form">
        
        <form action="" method="post">
            <label for="book" >Book</label>
            <input type="text" id="book" placeholder="Don quijote de La Mancha" minlength="5" maxlength="25" pattern="[A-Za-z]+"  required>
            <label for="author">Author</label>
            <input type="text" id="author" placeholder="Cervantes"  minlength="10" pattern="[A-Za-z]+"  required>
            <label for="pages"># of pages</label>
            <input id="pages" type="number" placeholder="666" required min="1">
            <label for="read">
            <input type="checkbox" name="read" id="read">
            have you read the book?
            </label>

        <button id="loadBook" type="button">Load Book</button>
        </form>
        
        <button id="closeDiag">Close</button>
    </dialog>
</body>
</html>
